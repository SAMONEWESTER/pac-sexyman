[project]
name = "pac-man"
version = "0.1.0"
description = "Ghosts! More ghosts!"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mazegen",
    "pydantic>=2.14.3",
    "pygame>=2.6.1",
]

[dependency-groups]
dev = [
    "flake8",
    "mypy",
    "pyinstaller",
]

[tool.uv.sources]
mazegen = { path = "lib/mazegen/mazegen-1.0.0-py3-none-any.whl" }

# The assigned maze package ships without type information and may not be
# modified, so mypy is told not to look for it (keeps `make lint-strict` clean).
[[tool.mypy.overrides]]
module = ["mazegen", "mazegen.*"]
ignore_missing_imports = true
